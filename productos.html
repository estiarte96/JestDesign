<!doctype html>
<html lang="es">
<head>
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TBZK1N6QGS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-TBZK1N6QGS');
  </script>
  <link rel="icon" type="image/png" href="/assets/images/favicon.webp">
  <meta name="theme-color" content="#1b6e3a">
  <meta charset="utf-8" />
  <title>Tienda – EST Ingenieros</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Catálogo de piezas de ingeniería, repuestos de automoción y herramientas técnicas.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root { --fg: #1a1a1a; --muted: #666; --line: #e5e5e5; --bg: #fff; --primary: #1b6e3a; --radius: 8px; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Montserrat', sans-serif; color: var(--fg); background: #f9f9f9; line-height: 1.6; }
    a { text-decoration: none; color: inherit; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }

    /* TIPOGRAFÍA INDUSTRIAL */
    h1, h2, h3, .filter-title { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; }

    /* LAYOUT: SIDEBAR + GRID */
    .shop-layout { display: grid; grid-template-columns: 260px 1fr; gap: 40px; margin-top: 40px; align-items: start; }

    /* SIDEBAR */
    .filters-sidebar { background: #fff; padding: 24px; border-radius: var(--radius); border: 1px solid var(--line); position: sticky; top: 100px; }
    .filter-group { margin-bottom: 24px; }
    .filter-title { font-size: 16px; margin-bottom: 12px; display: block; font-weight: 500; }
    
    /* Inputs */
    .search-box { position: relative; }
    .search-box input { width: 100%; padding: 10px 10px 10px 36px; border: 1px solid var(--line); border-radius: 50px; font-family: inherit; background: #fdfdfd; transition: .2s; }
    .search-box input:focus { border-color: var(--primary); outline: none; }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
    
    .cat-list label { display: flex; align-items: center; padding: 6px 0; cursor: pointer; color: var(--muted); font-size: 15px; transition: .2s; }
    .cat-list label:hover { color: var(--fg); }
    .cat-list input { margin-right: 10px; accent-color: var(--primary); }
    
    select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }

    /* GRID PRODUCTOS */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; }

    /* TARJETA PRODUCTO */
    .product-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; transition: transform .2s, box-shadow .2s; display: flex; flex-direction: column; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-color: #d0d0d0; }

    .card-img-wrap { width: 100%; aspect-ratio: 4/3; background: #f4f4f4; overflow: hidden; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
    .product-card:hover img { transform: scale(1.05); }

    .card-body { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; }
    .card-cat { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 4px; letter-spacing: 1px; }
    .card-title { font-family: 'Oswald', sans-serif; font-size: 18px; margin: 0 0 6px; font-weight: 500; line-height: 1.3; }
    .card-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    
    .card-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f0f0f0; padding-top: 12px; }
    .price { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 500; color: var(--primary); }
    .btn-view { font-size: 13px; font-weight: 600; background: #f0f0f0; padding: 6px 14px; border-radius: 50px; transition: .2s; }
    .product-card:hover .btn-view { background: var(--fg); color: #fff; }

    @media (max-width: 880px){ 
      .shop-layout { grid-template-columns: 1fr; } 
      .filters-sidebar { position: static; margin-bottom: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    }
    @media (max-width: 600px){ .filters-sidebar { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div data-include="header.html"></div>

  <main class="wrap">
    <div style="margin: 40px 0 20px;">
      <h1 style="margin:0; font-size:32px;">Catálogo</h1>
      <p style="color:var(--muted);">Soluciones técnicas y repuestos.</p>
    </div>

    <div class="shop-layout">
      <aside class="filters-sidebar">
        <div class="filter-group">
          <label class="filter-title">Buscar</label>
          <div class="search-box">
            <i class="fa fa-search"></i>
            <input id="search" type="search" placeholder="Buscar pieza...">
          </div>
        </div>
        <div class="filter-group">
          <label class="filter-title">Categoría</label>
          <div class="cat-list">
            <label><input type="radio" name="cat" value="" checked> Todas</label>
            <label><input type="radio" name="cat" value="coches"> Automoción</label>
            <label><input type="radio" name="cat" value="industrial"> Industrial</label>
            <label><input type="radio" name="cat" value="herramientas"> Herramientas</label>
          </div>
        </div>
        <div class="filter-group">
          <label class="filter-title">Ordenar</label>
          <select id="sort">
            <option value="name-asc">Nombre (A–Z)</option>
            <option value="price-asc">Precio (Menor a mayor)</option>
            <option value="price-desc">Precio (Mayor a menor)</option>
          </select>
        </div>
      </aside>

      <section id="products-grid" class="products-grid">
        </section>
    </div>
  </main>

  <div data-include="footer.html"></div>

  <script>
    // Lógica de carga de productos (igual que antes pero adaptada al estilo)
    document.addEventListener('DOMContentLoaded', async () => {
      // Include header/footer
      document.querySelectorAll('[data-include]').forEach(async el => {
        try { el.outerHTML = await (await fetch(el.getAttribute('data-include'))).text(); } catch(e){}
      });

      const grid = document.getElementById('products-grid');
      let products = [];
      
      try {
        const res = await fetch('assets/data/products.json');
        if(res.ok) products = await res.json();
      } catch(e) { console.warn('Error loading JSON'); }

      function render() {
        // ... (Tu lógica de filtro existente) ...
        const q = document.getElementById('search').value.toLowerCase();
        const cat = document.querySelector('input[name="cat"]:checked')?.value || '';
        const sort = document.getElementById('sort').value;
        
        let filtered = products.filter(p => {
          return (!cat || p.category === cat) && (p.title.toLowerCase().includes(q));
        });

        // Sort logic simplificada
        if(sort === 'price-asc') filtered.sort((a,b)=> a.price - b.price);
        if(sort === 'price-desc') filtered.sort((a,b)=> b.price - a.price);
        if(sort === 'name-asc') filtered.sort((a,b)=> a.title.localeCompare(b.title));

        grid.innerHTML = filtered.map(p => `
          <a class="product-card" href="${p.url || '#'}">
            <div class="card-img-wrap"><img src="${p.cover}" alt="${p.title}" loading="lazy"></div>
            <div class="card-body">
              <div class="card-cat">${p.category}</div>
              <div class="card-title">${p.title}</div>
              <div class="card-subtitle">${p.subtitle || ''}</div>
              <div class="card-footer">
                <span class="price">${p.price} €</span>
                <span class="btn-view">Ver</span>
              </div>
            </div>
          </a>
        `).join('') || '<p style="color:#666">No se encontraron productos.</p>';
      }

      document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', render));
      render();
    });
  </script>
</body>
</html>

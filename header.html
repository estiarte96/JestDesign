    <label for="nav-toggle" class="nav-toggle" aria-label="Abrir menú">
      <span></span><span></span><span></span>

    <ul class="navbar-nav" id="navMenu">
      <li><a href="/home.html" class="nav-link">Home</a></li>
      <li><a href="/proyectos.html" class="nav-link">Portfolio</a></li>

  <style>
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      /* --- AUMENTO DE TAMAÑO --- */
      padding: 22px 40px; /* Más espacio arriba/abajo y a los lados */
      border-bottom: 1px solid #eee;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
      transition: all 0.3s ease; /* Suavidad si luego añades efectos */
    }

    .navbar-logo img { 
      height: 55px; /* Antes era 42px - Logo más visible */
      display: block; 
    }

    .navbar-nav {
      display: flex;
      gap: 20px; /* Más separación entre links */
      list-style: none;
      margin: 0;
      padding: 0;
      align-items: center;
    }

    .nav-link {
      text-decoration: none;
      color: var(--fg);
      padding: 10px 15px; /* Área de clic más grande */
      border-radius: 10px;
      transition: all .2s ease;
      display: inline-block;
      font-size: 16px; /* Fuente un poco más grande y legible */
      font-weight: 500;
    }

    /* ... Resto de tus estilos (Hover, Active, Hamburguesa) se mantienen igual ... */

    /* AJUSTE MÓVIL (Para que el menú desplegable no quede muy pegado) */
    @media (max-width:768px){
      .navbar { padding: 15px 20px; } /* Un poco más pequeño en móvil para ahorrar espacio */
      .navbar-logo img { height: 45px; }
      
      .navbar-nav {
        top: 80px; /* Ajustado por el nuevo tamaño del header */
        left: 20px;
        right: 20px;
      }
    }
  </style>

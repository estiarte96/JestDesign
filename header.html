<header>
  <nav class="navbar">
    <!-- LOGO -->
    <a href="/home.html" class="navbar-logo">
      <img src="/assets/images/bg-logo.png" alt="EST Ingenieros Logo">
      <span></span>
    </a>

    <!-- Toggle (checkbox invisible) -->
    <input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox" />

    <!-- Botón hamburguesa -->
    <label for="nav-toggle" class="nav-toggle" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </label>

    <!-- MENÚ -->
    <ul class="navbar-nav" id="navMenu">
      <li><a href="/home.html" class="nav-link">Home</a></li>
      <li><a href="/proyectos.html" class="nav-link">Portfolio</a></li>
      <li><a href="/diseno3d.html" class="nav-link">Diseño 3D</a></li>
      <li><a href="/escaneo3d.html" class="nav-link">Ingeniería inversa</a></li>
      <li><a href="/contacto.html" class="nav-link">Contacto</a></li>
    </ul>
  </nav>

  <style>
    .navbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 20px;
      border-bottom:1px solid var(--line);
      background:#fff;
      position:sticky;
      top:0;
      z-index:100;
    }

    .navbar-logo{
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      color:var(--fg);
    }
    .navbar-logo img{
      height:42px;
      display:block;
    }

    .navbar-nav{
      display:flex;
      gap:14px;
      list-style:none;
      margin:0;
      padding:0;
      align-items:center;
    }

    /* 🔥 ESTILO DEL MENÚ */
    .nav-link{
      font-family: var(--font-title);   /* Oswald */
      font-weight: 500;
      letter-spacing: .6px;
      text-transform: uppercase;

      color:var(--fg);
      padding:8px 10px;
      border-radius:10px;
      transition:all .2s ease;
      display:inline-block;
    }

    .nav-link:hover{
      background:#f6f6f6;
    }

    .nav-link.active{
      border:1px solid var(--primary);
      background:#e9f5ee;
      font-weight:600;
      color:var(--primary);
    }

    /* HAMBURGUESA */
    .nav-toggle-checkbox{
      display:none;
    }

    .nav-toggle{
      display:none;
      border:1px solid #e6e6e6;
      background:#fff;
      border-radius:12px;
      padding:10px 12px;
      cursor:pointer;
      line-height:0;
      user-select:none;
    }

    .nav-toggle span{
      display:block;
      width:22px;
      height:2px;
      background:var(--fg);
      margin:4px 0;
    }

    /* MÓVIL */
    @media (max-width:768px){
      .nav-toggle{ display:block; }
      .navbar{ position:relative; }

      .navbar-nav{
        display:none;
        position:absolute;
        left:14px;
        right:14px;
        top:64px;
        flex-direction:column;
        gap:6px;
        background:#fff;
        border:1px solid #eee;
        border-radius:14px;
        padding:10px;
        box-shadow:0 12px 30px rgba(0,0,0,.08);
        z-index:1000;
      }

      .nav-toggle-checkbox:checked ~ .navbar-nav{
        display:flex;
      }

      .nav-link{
        width:100%;
        padding:10px 12px;
        border-radius:12px;
      }
    }
  </style>

  <script>
    // Marca link activo
    document.addEventListener("DOMContentLoaded", () => {
      const current = (window.location.pathname.split("/").pop() || "home.html").toLowerCase();
      document.querySelectorAll(".nav-link").forEach(link => {
        const href = (link.getAttribute("href") || "").split("/").pop().toLowerCase();
        if (href === current) link.classList.add("active");
      });
    });
  </script>
</header>

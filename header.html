<header>
  <nav class="navbar" style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:100;">
    
    <!-- LOGO -->
    <a href="/home.html" class="navbar-logo" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#111;">
      <img src="/assets/images/bg-logo.png" alt="EST Ingenieros Logo" style="height:42px;display:block;">
      <span style="font-weight:600;letter-spacing:.2px;"></span>
    </a>

    <!-- MENÚ -->
    <ul class="navbar-nav" style="display:flex;gap:14px;list-style:none;margin:0;padding:0;">
      <li><a href="/home.html" class="nav-link">Home</a></li>
      <li><a href="/proyectos.html" class="nav-link">Portfolio</a></li>
      <li><a href="/diseno3d.html" class="nav-link">Diseño 3D</a></li>
      <li><a href="/escaneo3d.html" class="nav-link">Ingeniería inversa</a></li>
      <li><a href="/contacto.html" class="nav-link">Contacto</a></li>
    </ul>
  </nav>

  <!-- Estil base -->
   <style>
  .nav-link { text-decoration:none; color:#111; padding:8px 10px; border-radius:10px; }
  .nav-link:hover { background:#f6f6f6; }
  .nav-link.active { border:1px solid #1b6e3a; background:#e9f5ee; color:#1b6e3a; font-weight:600; }
</style>

  <style>
    .nav-link {
      text-decoration:none;
      color:#111;
      padding:8px 10px;
      border-radius:10px;
      transition:all .2s ease;
    }
    .nav-link:hover {
      background:#f6f6f6;
    }
    /* 🔹 Estil de l'enllaç actiu */
    .nav-link.active {
      border:1px solid #1b6e3a;
      background:#e9f5ee;
      font-weight:600;
      color:#1b6e3a;
    }
  </style>

  <!-- Script: detecta la pàgina actual -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const current = window.location.pathname.split("/").pop().toLowerCase() || "home.html";
      document.querySelectorAll(".nav-link").forEach(link => {
        const href = link.getAttribute("href").toLowerCase();
        if (href === current) link.classList.add("active");
      });
    });
  </script>
</header>

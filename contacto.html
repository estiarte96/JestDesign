<!doctype html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <meta name="theme-color" content="#1b6e3a">
  <meta charset="utf-8" />
  <title>Contacto – EST Ingenieros</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Solicita presupuesto para diseño 3D, ingeniería inversa o maquinaria industrial.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="assets/css/global.css">
</head>
<body style="background: #fdfdfd;">

  <div data-include="header.html"></div>

  <main class="wrap">
    <div class="contact-grid">
      
      <div class="contact-info">
        <h1>Hablemos de tu Proyecto</h1>
        <p class="lead">¿Tienes una idea técnica o necesitas un repuesto? Estamos listos para ayudarte.</p>
        
        <div class="info-item">
          <i class="fa fa-phone"></i>
          <div>
            <h4>Teléfono</h4>
            <p>+34 639 709 440</p>
          </div>
        </div>
        
        <div class="info-item">
          <i class="fa-brands fa-whatsapp"></i>
          <div>
            <h4>WhatsApp</h4>
            <p><a href="https://wa.me/34639709440" target="_blank" style="color:var(--primary); font-weight:600;">Iniciar chat directo</a></p>
          </div>
        </div>
        
        <div class="info-item">
          <i class="fa fa-envelope"></i>
          <div>
            <h4>Email</h4>
            <p><a href="mailto:p.estiarte@gmail.com" style="color:var(--primary); font-weight:600;">p.estiarte@gmail.com</a></p>
          </div>
        </div>
      </div>

      <div class="contact-form">
        <form action="https://formspree.io/f/mlggezql" method="POST"> 
          <div class="form-group">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" class="form-control" placeholder="Tu nombre" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="tucorreo@ejemplo.com" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Asunto</label>
            <select name="asunto" class="form-control">
              <option value="General">Información General</option>
              <option value="Presupuesto-3D">Solicitar Presupuesto (Diseño 3D)</option>
              <option value="Presupuesto-Maquinaria">Solicitar Presupuesto (Maquinaria)</option>
              <option value="Tienda">Duda sobre Tienda</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label">Mensaje</label>
            <textarea name="mensaje" class="form-control" placeholder="Cuéntanos los detalles..." required></textarea>
          </div>

          <div style="margin-bottom: 15px; font-size: 13px; color: var(--muted);">
            <label><input type="checkbox" required> Acepto la política de privacidad</label>
          </div>

          <button type="submit" class="btn-submit">Enviar Mensaje</button>
        </form>
      </div>
    </div>
  </main>

  <div data-include="footer.html"></div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const slots = document.querySelectorAll('[data-include]');
      for (const el of slots) {
        try {
          const res = await fetch(el.getAttribute('data-include'));
          if (res.ok) el.outerHTML = await res.text();
        } catch (e) { console.error("Error en include", e); }
      }
    });
  </script>
</body>
</html>

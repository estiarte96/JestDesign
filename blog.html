  <style>
    /* Estilos extra específicos para las miniaturas del blog que no están en el global */
    .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; margin-bottom: 80px; }
    .card-excerpt { font-size: 14px; color: var(--muted); margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { margin-top: auto; padding-top: 15px; border-top: 1px solid #f0f0f0; font-size: 12px; color: #999; display: flex; justify-content: space-between; }
    
    /* Categorías */
    .categories { display: flex; justify-content: center; gap: 10px; margin-bottom: 50px; flex-wrap: wrap; }
    .cat-btn { padding: 8px 24px; border-radius: 50px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; background: #fff; cursor: pointer; transition: 0.3s; font-family: 'Montserrat'; }
    .cat-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(27,110,58,0.05); }

    /* Newsletter */
    .newsletter { background: #111; padding: 60px 20px; text-align: center; color: #fff; border-radius: 12px; margin-bottom: 60px; }
    .news-form { display: flex; gap: 10px; max-width: 500px; margin: 20px auto 0; }
    .news-input { flex: 1; padding: 12px 20px; border-radius: 50px; border: none; }
    .news-btn { background: var(--primary); color: #fff; border: none; padding: 12px 30px; border-radius: 50px; font-weight: 600; cursor: pointer; }
  </style>
</head>
